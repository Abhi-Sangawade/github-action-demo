name: AI DevOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test app import
        run: python -c "from app import app; print('OK')"

      - name: Test health route
        run: |
          python -m flask --app app run --port 5000 &
          sleep 3
          curl -f http://localhost:5000/health
          curl -f http://localhost:5000/api/info

      - name: Test AI agent import
        run: python -c "import ai_agent; print('AI Agent OK')"

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Save build info
        run: |
          echo "image=${{ secrets.DOCKER_USERNAME }}/my-app:latest" > build-info.txt
          echo "commit=${{ github.sha }}" >> build-info.txt
          echo "time=$(date)" >> build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d \
              --name my-app \
              --restart always \
              -p 80:5000 \
              -e ENV=production \
              -e DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
              -e APP_URL=http://localhost:5000 \
              ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            curl -f http://localhost/health && echo "DEPLOYMENT SUCCESS" || echo "DEPLOYMENT FAILED"
            docker ps | grep my-app

      - name: Save deploy info
        run: |
          echo "host=${{ secrets.EC2_HOST }}" > deploy-info.txt
          echo "time=$(date)" >> deploy-info.txt
          echo "commit=${{ github.sha }}" >> deploy-info.txt
          echo "branch=${{ github.ref_name }}" >> deploy-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-info
          path: deploy-info.txt
          retention-days: 30
