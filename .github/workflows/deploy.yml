name: DevOps Frontend Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          ls -la dist

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-portfolio:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops-portfolio:latest

      - name: Save build info
        run: |
          echo "image=${{ secrets.DOCKER_USERNAME }}/devops-portfolio:latest" > build-info.txt
          echo "commit=${{ github.sha }}" >> build-info.txt
          echo "time=$(date)" >> build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/devops-portfolio:latest
            docker stop devops-portfolio || true
            docker rm devops-portfolio || true
            docker run -d \
              --name devops-portfolio \
              --restart always \
              -p 80:5000 \
              -e ENV=production \
              -e APP_URL=http://localhost:5000 \
              ${{ secrets.DOCKER_USERNAME }}/devops-portfolio:latest

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            curl -f http://localhost/ && echo "DEPLOYMENT SUCCESS" || echo "DEPLOYMENT FAILED"
            docker ps | grep devops-portfolio

      - name: Save deploy info
        run: |
          echo "host=${{ secrets.EC2_HOST }}" > deploy-info.txt
          echo "time=$(date)" >> deploy-info.txt
          echo "commit=${{ github.sha }}" >> deploy-info.txt
          echo "branch=${{ github.ref_name }}" >> deploy-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-info
          path: deploy-info.txt
          retention-days: 30
