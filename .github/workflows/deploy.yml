name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run basic test
        run: python -c "from app import app; print('App imported successfully')" > test-report.txt 2>&1

      - name: Save test report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Save Docker build info as artifact
        run: |
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/my-app:latest" > docker-info.txt
          echo "Build time: $(date)" >> docker-info.txt
          echo "Commit: ${{ github.sha }}" >> docker-info.txt

      - name: Upload Docker info artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-info
          path: docker-info.txt

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --name my-app -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Save deployment info as artifact
        run: |
          echo "Deployed to: ${{ secrets.EC2_HOST }}" > deploy-info.txt
          echo "Deploy time: $(date)" >> deploy-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> deploy-info.txt
          echo "Branch: ${{ github.ref_name }}" >> deploy-info.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deploy-info.txt
          retention-days: 30